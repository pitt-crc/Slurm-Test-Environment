name: Publish Docker Images

on:
  pull_request:
  release:
    types: [ "released" ]

jobs:
  build:
    name: Build
    uses: ./.github/workflows/DockerTest.yml

  test:
    name: Test
    needs: build
    uses: ./.github/workflows/DockerTest.yml

  publish:
    runs-on: ubuntu-latest
    name: Publish Images
    needs: [ build, test ]

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build.outputs.matrix) }}

    steps:
      - name: Fetch image artifact
        uses: actions/download-artifact@v4
        with:
          name: slurm-${{ matrix.slurm-version }}
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/image.tar

      - name: Define Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image-tags }}
          labels: |
            edu.pitt.crc.slurm-tag=${{ matrix.slurm-version }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      #- name: Build and publish image
      #  uses: docker/build-push-action@v5
      #  with:
      #    push: true
      #    tags: ${{ matrix.image-tags }}
      #    labels: ${{ steps.meta.outputs.labels }}
      #    build-args: SLURM_VERSION=${{ matrix.slurm-version }}
