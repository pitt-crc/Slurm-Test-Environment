name: Build

on:
  workflow_call:
    outputs:
      matrix:
        description: "The first output string"
        value: ${{ jobs.build.outputs.matrix }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.export-matrix.outputs.matrix }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - slurm-version: 20.11.9
            image-tags: ghcr.io/${{ github.repository_owner }}/test-env:20.11.9

          - slurm-version: 22.05.2
            image-tags: ghcr.io/${{ github.repository_owner }}/test-env:22.05.2

          - slurm-version: 22.05.11
            image-tags: ghcr.io/${{ github.repository_owner }}/test-env:22.05.11

          - slurm-version: 23.02.5
            image-tags: ghcr.io/${{ github.repository_owner }}/test-env:23.02.5,ghcr.io/${{ github.repository_owner }}/test-env:latest

    steps:
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          tags: ${{ matrix.image-tags }}
          outputs: type=docker,dest=/tmp/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: slurm-${{ matrix.slurm-version }}
          path: /tmp/image.tar

      - name: Export Matrix
        id: export-matrix
        run: echo ${{ matrix }} >> "$GITHUB_OUTPUT"
