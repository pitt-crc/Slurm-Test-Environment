name: Build

on:
  workflow_call:
    outputs:
      matrix:
        description: "The first output string"
        value: ${{ jobs.matrix.outputs.matrix }}

jobs:
  matrix:
    name: Define Matrix
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.export-matrix.outputs.matrix }}

    steps:
      - name: Export Matrix
        id: export-matrix
        run:  |
          echo 'matrix={"include":[\
            {"project":"foo","config":"Debug"}, \
            {"project":"bar","config":"Release"} \
          ]}' >> $GITHUB_OUTPUT

  build:
    name: Build Images
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}

    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

