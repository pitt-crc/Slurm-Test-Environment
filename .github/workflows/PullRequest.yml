name: 🎯 Pull Request

on:
  pull_request:

jobs:
  matrix:
    name: Matrix
    uses: ./.github/workflows/Matrix.yml

  build:
    name: Build
    needs: [ matrix ]
    uses: ./.github/workflows/Build.yml
    with:
      matrix: ${{ needs.matrix.outputs.matrix }}

  test:
    name: Test
    needs: [ matrix, build ]
    uses: ./.github/workflows/Test.yml
    with:
      matrix: ${{ needs.matrix.outputs.matrix }}
